name: build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["main.go", "main_test.go", "sources.txt", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
      - run: go run . -sources sources.txt -out blocklist.txt
      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: rebuild blocklist"
            git push
          fi
